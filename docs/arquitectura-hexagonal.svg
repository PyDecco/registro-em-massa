<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura hexagonal del bounded context Catálogo</title>
  <desc id="desc">El dominio queda en el centro. La aplicación lo rodea con casos de uso y puertos. La infraestructura (HTTP NestJS y Sequelize/Postgres) depende hacia adentro.</desc>

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <filter id="sombra" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .fondo { fill: #f8fafc; }
      .marco { fill: none; stroke: #e2e8f0; stroke-width: 1; }
      .titulo { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitulo { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .capa { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .texto { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
      .textoChico { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #0f172a; }
      .monoBlanco { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .blanco { fill: #f8fafc; }
      .etiqueta { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
    </style>
  </defs>

  <rect class="fondo" x="0" y="0" width="1040" height="700"/>
  <rect class="marco" x="12" y="12" width="1016" height="676" rx="10"/>

  <text class="titulo" x="520" y="48" text-anchor="middle">Arquitectura hexagonal  Catálogo</text>
  <text class="subtitulo" x="520" y="70" text-anchor="middle">Las flechas muestran inversión de dependencias: todo apunta hacia el dominio</text>

  <!-- Hexágono externo: Infraestructura -->
  <polygon points="810,318 665,569 375,569 230,318 375,67 665,67"
           fill="#f1f5f9" stroke="#64748b" stroke-width="1.75"/>
  <text class="capa" x="520" y="92" text-anchor="middle" fill="#475569">INFRAESTRUCTURA</text>

  <!-- Hexágono medio: Aplicación -->
  <polygon points="720,318 620,491 420,491 320,318 420,145 620,145"
           fill="#dbeafe" stroke="#2563eb" stroke-width="1.75"/>
  <text class="capa" x="520" y="168" text-anchor="middle" fill="#1d4ed8">APLICACIÓN</text>
  <text class="textoChico" x="520" y="188" text-anchor="middle">Casos de uso</text>
  <text class="mono" x="520" y="206" text-anchor="middle">CadastrarProdutosEmMassa</text>
  <text class="mono" x="520" y="222" text-anchor="middle">BuscarProdutosPaginados</text>
  <text class="textoChico" x="520" y="456" text-anchor="middle">Puertos</text>
  <text class="mono" x="520" y="474" text-anchor="middle">ProdutoRepository · UnitOfWork</text>

  <!-- Hexágono interno: Dominio -->
  <polygon points="638,318 579,420 461,420 402,318 461,216 579,216"
           fill="#1e3a5f" stroke="#0f172a" stroke-width="1.75" filter="url(#sombra)"/>
  <text class="capa blanco" x="520" y="250" text-anchor="middle">DOMINIO</text>
  <text class="texto blanco" x="520" y="272" text-anchor="middle">Bounded context: Catálogo</text>
  <text class="texto blanco" x="520" y="292" text-anchor="middle">Aggregate Produto</text>
  <text class="monoBlanco" x="520" y="316" text-anchor="middle">Sku</text>
  <text class="monoBlanco" x="520" y="334" text-anchor="middle">Desconto</text>
  <text class="monoBlanco" x="520" y="352" text-anchor="middle">PeriodoVigencia</text>
  <text class="texto blanco" x="520" y="380" text-anchor="middle" font-size="11">invariantes y comportamiento</text>

  <!-- Adapter HTTP -->
  <g filter="url(#sombra)">
    <rect x="36" y="248" width="210" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  </g>
  <text class="capa" x="141" y="278" text-anchor="middle" fill="#0f766e">ADAPTER IN</text>
  <text class="texto" x="141" y="302" text-anchor="middle" font-weight="700">Controller HTTP</text>
  <text class="mono" x="141" y="322" text-anchor="middle">NestJS</text>
  <text class="textoChico" x="141" y="344" text-anchor="middle">POST/GET /produtos</text>
  <line x1="246" y1="307" x2="318" y2="307" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text class="etiqueta" x="282" y="296" text-anchor="middle">depende de</text>

  <!-- Adapter persistencia -->
  <g filter="url(#sombra)">
    <rect x="794" y="248" width="210" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  </g>
  <text class="capa" x="899" y="278" text-anchor="middle" fill="#b45309">ADAPTER OUT</text>
  <text class="texto" x="899" y="302" text-anchor="middle" font-weight="700">Sequelize / Postgres</text>
  <text class="mono" x="899" y="322" text-anchor="middle">ProdutoModel · UoW</text>
  <text class="textoChico" x="899" y="344" text-anchor="middle">implementa los puertos</text>
  <line x1="794" y1="307" x2="722" y2="307" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text class="etiqueta" x="758" y="296" text-anchor="middle">depende de</text>

  <!-- Flechas internas aplicación ’ dominio -->
  <line x1="520" y1="232" x2="520" y2="220" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#flechaAzul)"/>
  <line x1="520" y1="444" x2="520" y2="422" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#flechaAzul)"/>

  <!-- Flujo todo o nada -->
  <rect x="70" y="592" width="900" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  <text class="capa" x="520" y="616" text-anchor="middle" fill="#0f172a">FLUJO TODO O NADA</text>

  <rect x="110" y="628" width="230" height="26" rx="13" fill="#dbeafe" stroke="#2563eb"/>
  <text class="textoChico" x="225" y="646" text-anchor="middle">1. Validación en el dominio</text>
  <line x1="340" y1="641" x2="390" y2="641" stroke="#334155" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="390" y="628" width="260" height="26" rx="13" fill="#dbeafe" stroke="#2563eb"/>
  <text class="textoChico" x="520" y="646" text-anchor="middle">2. Transacción (UnitOfWork)</text>
  <line x1="650" y1="641" x2="700" y2="641" stroke="#334155" stroke-width="1.5" marker-end="url(#flecha)"/>

  <rect x="700" y="628" width="230" height="26" rx="13" fill="#fee2e2" stroke="#b91c1c"/>
  <text class="textoChico" x="815" y="646" text-anchor="middle">3. Commit o rollback</text>
</svg>
